; UniversityAI 開發環境的 PHP 設定
;
; max_input_vars 是 Moodle 5.2 的硬性需求（>= 5000）。預設值 1000，
; 不改的話安裝前的環境檢查就會擋下來，而且訊息不明顯。

max_input_vars = 5000

memory_limit = 512M
max_execution_time = 300

; 課綱 PDF 通常不大，但掃描版可能到數十 MB；兩個值要一起改，
; 只改 upload_max_filesize 而沒改 post_max_size 是常見的無效設定。
upload_max_filesize = 64M
post_max_size = 68M

; Moodle 對這兩項有明確要求
max_input_time = 300
date.timezone = Asia/Taipei

; 開發環境：把錯誤顯示出來，不要靜默失敗
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; ── 效能：這一段在 Windows 主機上是必要的，不是調校 ──────────────────
; Moodle 每個請求要讀數百個 PHP 檔，而 Windows 的 Docker bind mount 對
; 大量小檔案的 stat/read 極慢。未調整前實測頁面載入 14 秒，NFR-PRF-04
; 要求 2 秒內。
;
; realpath_cache 是這裡影響最大的一項——它快取路徑解析結果，直接減少對
; bind mount 的 stat 呼叫。預設 16k 對 Moodle 這種規模瞬間就滿了。
realpath_cache_size = 4096k
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0

; Moodle 核心有上萬個 PHP 檔，預設的 10000 上限會讓超出的檔案完全不被快取。
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; 開發環境保留時間戳檢查，讓改過的外掛程式碼會生效；
; 但不要每次請求都檢查（revalidate_freq = 0），那等於把 realpath 快取的
; 好處還回去。設 2 秒是「改完存檔、切回瀏覽器」這段時間的合理值。
; 正式環境應改為 validate_timestamps = 0 並於部署後重啟 PHP。
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
