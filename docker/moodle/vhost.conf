# UniversityAI 的 Apache 設定
#
# 關鍵：document root 是 <moodle>/public，不是 <moodle> 本身。
# Moodle 自 5.1 起把網站根目錄移入 public/（見 docs/architecture.md D-09、§7.2）。
# 指錯的症狀是首頁丟出 rootdirpublic 例外——Moodle 根目錄的 index.php 就是為了
# 攔截這個錯誤而存在的。
#
# 這個結構的附帶好處：config.php 位於 /var/www/moodle/config.php，
# 在 document root 之外，網頁伺服器無論如何都讀不到它。

<VirtualHost *:80>
    DocumentRoot /var/www/moodle/public

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Moodle 的 slasharguments 依賴 PATH_INFO，關掉會讓檔案下載連結失效
        AcceptPathInfo On
    </Directory>

    # 明確擋掉 document root 以外的路徑，避免將來有人改錯設定時把根目錄暴露出去
    <Directory /var/www/moodle>
        Require all denied
    </Directory>
    <Directory /var/www/moodledata>
        Require all denied
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
